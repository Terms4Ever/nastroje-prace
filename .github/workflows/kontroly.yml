name: Pravidla / nastroje-prace
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Vychozi commit rozsahu, ROOT pouze pro prvni commit'
        required: true
        type: string
permissions:
  contents: read
  issues: read
jobs:
  linux:
    name: Linux a SVN
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NASTROJE_REQUIRE_SVN: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prostredi
        run: |
          if ! php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("mbstring") && extension_loaded("curl") && extension_loaded("zip") && extension_loaded("SimpleXML") ? 0 : 1);' || ! command -v svn >/dev/null || ! command -v svnadmin >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-mbstring php-curl php-zip php-xml subversion
          fi
          git config user.name "Overeni"
          git config user.email "overeni@example.invalid"
          php prace.php bootstrap
      - name: Dokumentace, commity, issues a testy
        run: php scripts/ci.php
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prostredi
        run: |
          git config user.name "Overeni"
          git config user.email "overeni@example.invalid"
          .\prace.ps1 bootstrap --php-windows
          .\prace.ps1 install-hooks
      - name: Dokumentace, commity, issues a testy
        run: .\.cache\php\php.exe scripts/ci.php
  povinne:
    name: Povinne kontroly
    runs-on: ubuntu-24.04
    needs: [linux, windows]
    if: always()
    steps:
      - name: Obe platformy musi projit
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success
