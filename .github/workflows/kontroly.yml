name: Kontroly
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  linux:
    name: Linux a SVN
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NASTROJE_REQUIRE_SVN: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prostredi
        run: |
          if ! command -v svn >/dev/null || ! command -v svnadmin >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y subversion
          fi
          git config user.name "Overeni"
          git config user.email "overeni@example.invalid"
          python -m nastroje_prace bootstrap
      - name: Dokumentace, commity, issues a testy
        run: python scripts/ci.py
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prostredi
        run: |
          git config user.name "Overeni"
          git config user.email "overeni@example.invalid"
          python -m nastroje_prace bootstrap --php-windows
      - name: Dokumentace, commity, issues a testy
        run: python scripts/ci.py
  povinne:
    name: Povinne kontroly
    runs-on: ubuntu-24.04
    needs: [linux, windows]
    if: always()
    steps:
      - name: Obe platformy musi projit
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success
